<body>
<!--
THESIS: A coming-soon page that is already useful: a family learns where and when to show up, not just that a site is on the way. Refuses the countdown-and-email-capture placeholder.
OWN-WORLD: The winning Scout design (Design 2): forest field with brass topo contours, parchment slab type, the troop badge, and wooden trail signs bolted to a post.
STORY: A parent who found Troop 134 on BeAScout learns it is a real, active troop in Folsom, sees the Tuesday 7:00 PM meeting at Journey Church, and either taps through to the map or emails join@troop134.org.
FIRST VIEWPORT: Desktop: copy left (Troop 134 Folsom headline, one line of news), signpost below it with two boards (MEET, ASK); badge right at ~440px. Phone: badge top-left at 180px, headline, news, signpost, all inside one screen at 375x812.
FORM: Extension of the established Design 2 world (no concept roll; world inherited from the troop vote). Signature: the signpost boards swing and settle once.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
-->
<main class="field">
  <div class="camp">
    <img class="badge"
      src="images/troop-134-logo-512.webp"
      srcset="images/troop-134-logo-512.webp 512w, images/troop-134-logo-840.webp 840w"
      sizes="(max-width: 760px) 180px, 440px"
      width="440" height="439"
      alt="Troop 134 Folsom, California badge: the Rainbow Bridge over the American River, an eagle, and the words Community Service, Backpacking, Camping and Be Prepared">
    <div class="copy">
      <h1>Troop 134 <span>Folsom</span></h1>
      <p class="news">Our Scouts are building the troop&rsquo;s new website. <strong>Until it&rsquo;s ready, here&rsquo;s where to find us.</strong></p>
      <div class="signpost">
        <a class="board" href="https://www.google.com/maps/search/?api=1&amp;query=Journey+Church+450+Blue+Ravine+Road+Folsom+CA+95630">
          <span class="label" aria-hidden="true">Meet</span>
          <span class="text">
            <strong>Every Tuesday, 7:00 PM</strong>
            <span class="sub">Journey Church, 450 Blue Ravine Road, Folsom</span>
          </span>
        </a>
        <a class="board" href="mailto:join@troop134.org">
          <span class="label" aria-hidden="true">Ask</span>
          <span class="text">
            <strong>Questions about joining?</strong>
            <span class="sub">join@troop134.org</span>
          </span>
        </a>
      </div>
    </div>
  </div>
</main>
</body>
